aid: kitro
name: KITRO
description: KITRO is a Swiss company founded in 2017 in Zurich that helps professional kitchens measure and
  reduce food waste through AI-powered automation. Its KITRO TARE device pairs an IoT scale with a camera and
  computer vision to automatically identify, weigh and categorize discarded food with no change to kitchen
  workflow, feeding a cloud analytics dashboard that surfaces waste trends by time, item and station, compares
  performance across properties, and exports reports for sustainability and EU food-waste compliance reporting.
  KITRO serves hotel groups and resorts, hospitals and care homes, corporate canteens, universities and schools,
  and river and ocean cruise operators in 20+ countries, with customers including Marriott, Hyatt, TUI BLUE,
  Pestana, 25hours Hotels and Sydney Opera Bar. KITRO publishes no public developer API, SDKs or developer
  portal — the only customer-facing software surface is the authenticated dashboard at my.kitro.ch — but it does
  publish an llms.txt agent-readable company description at www.kitro.ch/llms.txt.
